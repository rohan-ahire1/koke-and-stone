name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate HTML
        run: npx --yes html-validate@11.21.1 "*.html"
      - name: Check local links and asset paths
        run: node scripts/check-links.mjs
